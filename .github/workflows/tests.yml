name: Test ENJOY AI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check core.mjs
          node --check app.mjs
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Test scoring and browser flows
        run: node --test tests/*.test.mjs
